<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Illu — illustration vectorielle générative</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Illu</h1>
      <div class="topbar-shapes" id="toolbar-shapes"></div>
      <div class="topbar-actions" id="toolbar-actions"></div>
    </header>

    <main class="workspace">
      <section class="panel panel-left" aria-labelledby="layers-title">
        <h2 id="layers-title">Calques</h2>
        <div id="layer-panel"></div>
      </section>

      <section class="stage-wrap" aria-label="Plan de travail">
        <svg
          id="stage"
          xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="900"
          viewBox="0 0 900 900"
          role="img"
          aria-label="Illustration en cours"
        ></svg>
        <p class="stage-hint" id="stage-hint">Glisser depuis le centre pour dessiner</p>
      </section>

      <section class="panel panel-right" aria-labelledby="shapes-title">
        <h2 id="shapes-title">Formes du calque</h2>
        <div id="shape-list" role="group" aria-labelledby="shapes-title"></div>
      </section>
    </main>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
