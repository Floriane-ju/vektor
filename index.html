<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vektor — illustration vectorielle générative</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Le plan de travail occupe tout l'écran ; les panneaux flottent dessus. -->
    <main class="stage-wrap" aria-label="Plan de travail">
      <figure class="artboard">
        <figcaption class="artboard-caption"><strong>Zone de dessin</strong> <span>900 × 900</span></figcaption>
        <svg
          id="stage"
          xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="900"
          viewBox="0 0 900 900"
          role="img"
          aria-label="Illustration en cours"
        ></svg>
      </figure>
    </main>

    <h1 class="brand">Vektor</h1>
    <div class="float pill top-actions" id="toolbar-actions"></div>

    <section class="float panel panel-left" aria-labelledby="layers-title">
      <h2 id="layers-title">Calques</h2>
      <div id="layer-panel"></div>
      <div id="shape-list" role="group" aria-label="Formes du calque"></div>
    </section>

    <section class="float panel panel-right" id="inspector" aria-label="Réglages"></section>

    <div class="float pill tools" id="toolbar-shapes"></div>
    <div class="float pill view-controls" id="view-controls"></div>

    <p class="float status" id="status" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
