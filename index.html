<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vektor — illustration vectorielle générative</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Le plan de travail, infini, occupe tout l'écran ; les panneaux flottent
         dessus. Son viewBox est la vue (ui/zoom.js). -->
    <main class="stage-wrap" aria-label="Plan de travail">
      <svg
        id="stage"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 900 900"
        role="img"
        aria-label="Illustration en cours"
      ></svg>
    </main>

    <header class="topbar">
      <h1 class="brand">Vektor</h1>
      <nav class="float pill drawing-tabs" id="drawing-tabs"></nav>
    </header>
    <div class="top-right">
      <div class="float pill stroke-card" id="stroke-card" role="group" aria-label="Trait de la forme"></div>
      <div class="float pill" id="toolbar-actions"></div>
    </div>

    <section class="float panel panel-left" aria-labelledby="layers-title">
      <h2 id="layers-title">Calques</h2>
      <div id="layer-panel"></div>
      <div id="shape-list" class="shape-list" role="group" aria-label="Formes du calque"></div>
    </section>

    <section class="float panel panel-right" id="inspector" aria-label="Réglages"></section>

    <div class="float pill tools" id="toolbar-shapes"></div>
    <div class="float pill view-controls" id="view-controls"></div>

    <p class="float status" id="status" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
